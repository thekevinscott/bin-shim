[putitoutthere]
version = 1

[[package]]
# Keeps the pre-monorepo identifier and `v{version}` tag format so release
# history stays continuous (v0.1.0 was tagged before the packages/ split).
name = "bin-shim"
kind = "npm"
npm = "bin-shim"
path = "packages/javascript"
first_version = "0.1.0"
tag_format = "v{version}"
globs = [
  "packages/javascript/src/**",
  "packages/javascript/package.json",
  "packages/javascript/tsconfig.json",
  "packages/javascript/README.md",
  "packages/javascript/CHANGELOG.md",
  "pnpm-lock.yaml",
  "LICENSE",
]

[[package]]
# py/-prefixed identifier for tag namespacing (py/bin-shim-v{version}),
# mirroring cachetta. Must match pyproject.toml [project].name — piot's
# pre-flight asserts this.
name = "py/bin-shim"
kind = "pypi"
pypi = "bin-shim"
build = "setuptools"
path = "packages/python"
first_version = "0.1.0"
globs = [
  "packages/python/src/**",
  "packages/python/pyproject.toml",
  "packages/python/setup.py",
  "packages/python/MANIFEST.in",
  "packages/python/README.md",
  "packages/python/CHANGELOG.md",
  "LICENSE",
]
