name: Fixture Conformance

# The fixture tier of spec/conformance.md: build the reference napi + pyo3
# crate once, then run both languages' conformance suites against it. The
# per-language workflows run the fake tier only — those suites skip
# themselves when the fixture is absent, so this job is what exercises real
# mid-run signal delivery, real native fd writes, and row 8.
#
# The `conformance` job is POSIX; `windows-ctrl` below covers rows 4-5 with
# real console control events.

on:
  push:
    branches: [main]
    paths:
      - 'fixtures/native/**'
      - 'packages/**'
      - 'spec/**'
      - '.github/workflows/fixture-conformance.yaml'
  pull_request:
    paths:
      - 'fixtures/native/**'
      - 'packages/**'
      - 'spec/**'
      - '.github/workflows/fixture-conformance.yaml'

permissions: { contents: read }

jobs:
  conformance:
    name: Fixture tier (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fixtures/native

      # Scoped to the core crate: it holds every test, and building test
      # harnesses for the two binding crates would try to link the host
      # runtime's symbols into an executable, where the extension-module
      # `dynamic_lookup` trick does not apply.
      - name: Fixture unit tests
        working-directory: fixtures/native
        run: cargo test --release -p bin-shim-fixture-core

      - name: Build and stage the fixture
        run: ./fixtures/native/build.sh

      # --- JavaScript -----------------------------------------------------
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the JS package
        working-directory: packages/javascript
        run: pnpm run build

      - name: JS fixture-tier conformance
        working-directory: packages/javascript
        run: pnpm exec vitest run tests/integration/fixture.conformance.test.ts

      # --- Python ---------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        working-directory: packages/python
        run: uv sync

      - name: Python fixture-tier conformance
        working-directory: packages/python
        run: uv run pytest tests/integration/fixture_conformance_test.py -v

      # A skipped suite would otherwise pass silently and this whole job
      # would prove nothing — fail loudly if the fixture wasn't picked up.
      #
      # Match the fixture-missing skip *reason*, not the word "skipped":
      # the Windows-only rows skip legitimately here, so a blanket check
      # fails on exactly the runs it is supposed to bless.
      - name: Assert the fixture tier actually ran
        working-directory: packages/python
        run: |
          set -euo pipefail
          out=$(uv run pytest tests/integration/fixture_conformance_test.py -q -rs 2>&1)
          echo "$out"
          if grep -q 'native fixture not built' <<<"$out"; then
            echo "::error::fixture-tier suite skipped — the built fixture was not found"
            exit 1
          fi
          if ! grep -qE '[1-9][0-9]* passed' <<<"$out"; then
            echo "::error::fixture-tier suite ran no tests at all"
            exit 1
          fi

  # Rows 4-5: real console control events on Windows. Kept as its own job
  # because the mechanism is entirely different from POSIX — see the
  # ctrl-event helper crate for why neither Node nor a plain
  # GenerateConsoleCtrlEvent call from the runner can do this safely.
  windows-ctrl:
    name: Fixture tier (windows-latest, ctrl-c)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fixtures/native

      - name: Build and stage the fixture
        shell: bash
        run: ./fixtures/native/build.sh

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the JS package
        working-directory: packages/javascript
        run: pnpm run build

      - name: JS Windows ctrl-c conformance
        working-directory: packages/javascript
        run: pnpm exec vitest run tests/integration/fixture.conformance.test.ts

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        working-directory: packages/python
        run: uv sync

      - name: Python Windows ctrl-c conformance
        working-directory: packages/python
        run: uv run pytest tests/integration/fixture_conformance_test.py -v

      # These rows are the entire point of this job; a skip here means the
      # harness did not run and the job proved nothing. Match the two
      # reasons that would mean that, rather than the word "skipped" —
      # the POSIX-only rows skip legitimately on this runner.
      - name: Assert rows 4-5 actually ran
        shell: bash
        working-directory: packages/python
        run: |
          set -euo pipefail
          out=$(uv run pytest tests/integration/fixture_conformance_test.py -q -rs 2>&1)
          echo "$out"
          if grep -qE 'native fixture not built|console-control harness not available' <<<"$out"; then
            echo "::error::Windows ctrl-c rows skipped — fixture or harness not found"
            exit 1
          fi
