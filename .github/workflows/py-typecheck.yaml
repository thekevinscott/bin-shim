name: Python Typecheck

on:
  push:
    branches: [main]
    paths:
      - 'packages/python/**'
      - '.github/workflows/py-typecheck.yaml'
  pull_request:
    paths:
      - 'packages/python/**'
      - '.github/workflows/py-typecheck.yaml'

permissions: { contents: read }

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: packages/python
        run: uv sync

      - name: Typecheck
        working-directory: packages/python
        env:
          # Emit GitHub Actions annotations so diagnostics show inline on PRs.
          TY_OUTPUT_FORMAT: github
        run: make typecheck
