name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_packages:
        description: >
          Packages to release manually, bypassing change detection.
          Comma-separated list of name[@<bump|version>] entries,
          e.g. `bin-shim@minor` or `bin-shim@0.2.0,py/bin-shim`.
          Leave empty to fall back to change detection.
        required: false
        default: ''

jobs:
  release:
    uses: thekevinscott/putitoutthere/.github/workflows/release.yml@v0
    with:
      release_packages: ${{ inputs.release_packages || '' }}
    permissions:
      contents: write
      id-token: write

  # Pasted verbatim from putitoutthere's quickstart. Skipped automatically
  # when the run produces no PyPI artifacts (bin-shim is npm-only); kept
  # in place so adding a future PyPI package is a config-only change.
  pypi-publish:
    needs: release
    if: needs.release.outputs.has_pypi == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-sdist'
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-wheel-*'
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
